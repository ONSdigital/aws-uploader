name: Terraform plan and apply
permissions: { contents: read }

on:
  workflow_call:
    inputs:
      event_name:
        description: The triggering event name (github.event_name from caller)
        required: true
        type: string
      runner:
        description: GitHub Actions runner label
        required: true
        type: string
      terraform_version:
        description: Terraform version
        required: false
        type: string
        default: "1.14.0"
      backend_bucket:
        description: S3 bucket for Terraform state
        required: true
        type: string
      backend_key:
        description: S3 state file key
        required: true
        type: string
      backend_region:
        description: S3 backend region
        required: false
        type: string
        default: "eu-west-2"
      var_file:
        description: Path to tfvars file
        required: true
        type: string
      working_directory:
        description: Terraform working directory
        required: false
        type: string
        default: "."
      additional_upload_paths:
        description: Additional paths to upload with the plan (newline-separated)
        required: false
        type: string
        default: ""
      terraform_args:
        description: Additional terraform plan/apply arguments
        required: false
        type: string
        default: ""
      plan_artifact_retention_days:
        description: Number of days to retain plan artifacts
        required: false
        type: number
        default: 5
      enable_plan_output:
        description: Whether to output plan results as PR comment
        required: false
        type: boolean
        default: false
      environment_variables:
        description: Environment variables to set (JSON format)
        required: false
        type: string
        default: "{}"

jobs:
  plan:
    if: inputs.event_name == 'pull_request'
    name: Terraform Plan
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Environment Variables
        if: inputs.environment_variables != '{}'
        env:
          ENV_VARSownload-artifact: ${{ inputs.environment_variables }}
        run: |
          echo '$ENV_VARS' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Init
        env:
          BUCKET: ${{ inputs.backend_bucket }}
          KEY: ${{ inputs.backend_key }}
          REGION: ${{ inputs.backend_region }}
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET" \
            -backend-config="key=$KEY" \
            -backend-config="region=$REGION" \
            -backend-config="use_lockfile=true"

      - name: Terraform Plan
        id: plan
        env:
          FILE: ${{ inputs.var_file }}
          ARGS: ${{ inputs.terraform_args }}
        run: terraform plan -var-file="$FILE" $ARGS -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ inputs.working_directory }}/tfplan
            ${{ inputs.additional_upload_paths }}
          retention-days: ${{ inputs.plan_artifact_retention_days }}

  apply:
    if: inputs.event_name == 'push'
    name: Terraform Apply
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Environment Variables
        if: inputs.environment_variables != '{}'
        env:
          ENV_VARS: ${{ inputs.environment_variables }}
        run: |
          echo '$ENV_VARS' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Init
        env:
          BUCKET: ${{ inputs.backend_bucket }}
          KEY: ${{ inputs.backend_key }}
          REGION: ${{ inputs.backend_region }}
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET" \
            -backend-config="key=$KEY" \
            -backend-config="region=$REGION" \
            -backend-config="use_lockfile=true"

      - name: Find Plan Artifact
        id: find-plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.1
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const pr = prs.data.find(p => p.merged_at !== null);
            if (!pr) {
              core.setFailed('No merged PR found for this commit');
              return;
            }
            const headSha = pr.head.sha;
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `tfplan-${headSha}`,
            });
            const artifact = artifacts.data.artifacts[0];
            if (!artifact) {
              core.setFailed(`No plan artifact found for commit ${headSha}`);
              return;
            }
            core.setOutput('head-sha', headSha);
            core.setOutput('run-id', artifact.workflow_run.id);

      - name: Download Plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ steps.find-plan.outputs.head-sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-plan.outputs.run-id }}
          path: ${{ inputs.working_directory }}

      - name: Terraform Apply
        env:
          ARGS: ${{ inputs.terraform_args }}
        run: terraform apply $ARGS tfplan
