name: GitHub Actions Security Analysis with zizmor 🌈
run-name: ${{github.workflow}} - ${{ github.actor }} pushed a change to ${{github.ref_name}}
permissions: { contents: read }

on:
  workflow_call:
    inputs:
      config-path:
        required: false
        type: string
        default: "./configs/zizmor.yaml"
      advanced-security:
        required: false
        type: boolean
        default: false # Only use on public repositories
      online-audits:
        required: false
        type: boolean
        default: false # Only use on public actions
      runs_on:
        description: Runner label for the job
        required: false
        type: string
        default: "ubuntu-latest"
jobs:
  zizmor:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          config: ${{ inputs.config-path }}
          advanced-security: ${{ inputs.advanced-security }}
          online-audits: ${{ inputs.online-audits }}
