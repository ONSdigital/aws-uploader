# ---------------------------------------------------------------------------
# Awesome Service. N = 3 boxes, all required.
#
# This file lives at services/<service_id>/service.yaml; the folder name
# must match service_id and becomes the service's map key in local.services.
# ---------------------------------------------------------------------------
service_id: mega-service
onboarding_csv: services/awesome-service/users.csv

wording:
  page_title: ONS-Uploader
  heading_prefix: "Mega Service - "
  contact_email: james.williams@ons.gov.uk
  uploading_banner: Uploading. Do not refresh or close the page.
  submit_text: Submit

# One entry per upload box. The count of boxes = the number of submissions.
boxes:
  - id: mega
    label: Upload the mega file
    description: "File must be named with the format 'I_AM_MEGA'"
    required: true
    accepted_types: ["csv"]
    accepted_extensions: [".csv"]
    filename_prefix: I_AM_AWESOME_
  - id: also-mega
    label: Upload the Other Awesome file
    description: "File must be named with the format 'I_AM_ALSO_MEGA'"
    required: true
    accepted_types: ["csv"]
    accepted_extensions: [".csv"]
    filename_prefix: I_AM_ALSO_AN_AWESOME_
  - id: mani
    label: Upload the MANI file
    description: "File must be named with the format 'MEGA_MANI'"
    required: false
    accepted_types: ["csv"]
    accepted_extensions: [".csv"]
    filename_prefix: MEGA_MANI_

cross_file_rules:
  - type: matching_date_suffix
    boxes: ["mega", "also-mega", "mani"]
