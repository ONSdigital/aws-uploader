---
platform: linux
image_resource:
  type: docker-image
  source:
    repository: 013353241801.dkr.ecr.eu-west-2.amazonaws.com/awscli_terraform
    tag: latest
    aws_access_key_id: ${AWS_ACCESS_KEY_ID}
    aws_secret_acess_key: ${AWS_SECRET_ACCESS_KEY}
inputs:
  - name: pull-request
outputs:
  - name: terraform-output
run:
  path: sh
  args: ["./ci/tasks/terraform/terraform-plan.sh"]
  dir: pull-request
